[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "promptguard"
version = "0.1.0"
description = "Prompt-injection guardrail for RAG / agent apps: rules + char n-gram classifier, measured on the public deepset/prompt-injections benchmark, served behind a FastAPI guard with JSONL tracing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "fastapi>=0.110",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27", "uvicorn>=0.29"]

[project.scripts]
promptguard = "promptguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
